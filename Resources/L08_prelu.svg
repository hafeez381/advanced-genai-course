<svg xmlns="http://www.w3.org/2000/svg" width="420" height="300" font-family="sans-serif" font-size="12">
<rect width="420" height="300" fill="white"/>
<line x1="20" y1="200" x2="400" y2="200" stroke="#999"/><line x1="210" y1="20" x2="210" y2="290" stroke="#999"/>
<text x="402" y="204">z</text>
<path d="M30.0,380.0 L210.0,200.0 L300.0,110.0" stroke="#d62728" stroke-width="2" fill="none" stroke-dasharray="6,4"/>
<path d="M30.0,245.0 L210.0,200.0 L300.0,110.0" stroke="#1f77b4" stroke-width="2.5" fill="none"/>
<path d="M30.0,201.8 L210.0,200.0 L300.0,110.0" stroke="#2ca02c" stroke-width="2" fill="none"/>
<text x="25" y="20" font-weight="bold">PReLU(z) = z if z ≥ 0, αz if z &lt; 0 (α learned)</text>
<text x="25" y="250" fill="#1f77b4">α = 0.25 (learned value)</text>
<text x="25" y="266" fill="#2ca02c">α = 0.01 (Leaky ReLU)</text>
<text x="25" y="282" fill="#d62728">α = 1: identity, the bend vanishes</text>
</svg>